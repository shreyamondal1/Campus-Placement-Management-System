[project]
name = "placement-connect-backend"
version = "1.0.0"
dependencies = [
    "celery>=5.6.3",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-mail>=0.10.0",
    "flask-restx>=1.3.2",
    "flask-sqlalchemy>=3.1.1",
    "openpyxl>=3.1.5",
    "redis>=8.1.0",
    "xhtml2pdf>=0.2.17",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
